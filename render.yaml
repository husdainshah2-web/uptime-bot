services:
  - type: web
    name: uptime-bot
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CHECK_INTERVAL_MINUTES
        value: "4"
      - key: DATA_DIR
        value: /opt/render/project/src/data
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
